<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Libro</title>
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: encabezado}"></div>

<div class="contenido">
	<div th:replace="~{fragments/layout :: mensajes}"></div>

	<h1 th:text="${libro.id == null} ? 'Nuevo libro' : 'Editar libro'">Libro</h1>

	<form th:action="@{/admin/libros/guardar}" th:object="${libro}" method="post">
		<input type="hidden" th:field="*{id}">

		<p>
			<label for="titulo">Titulo</label><br>
			<input type="text" id="titulo" th:field="*{titulo}" required>
		</p>

		<p>
			<label for="autor">Autor</label><br>
			<input type="text" id="autor" th:field="*{autor}" required>
		</p>

		<p>
			<label for="isbn">ISBN</label><br>
			<input type="text" id="isbn" th:field="*{isbn}" required>
		</p>

		<p>
			<label for="categoria">Categoria</label><br>
			<input type="text" id="categoria" th:field="*{categoria}" required>
		</p>

		<button type="submit">Guardar</button>
		<a th:href="@{/libros}">Volver</a>
	</form>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>

</body>
</html>
