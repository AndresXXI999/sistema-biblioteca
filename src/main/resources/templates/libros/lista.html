<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Catalogo de libros</title>
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: encabezado}"></div>

<div class="contenido">
	<h1>Catalogo de libros</h1>

	<div th:replace="~{fragments/layout :: mensajes}"></div>

	<form th:action="@{/libros}" method="get">
		<select name="campo">
			<option value="titulo" th:selected="${campo == 'titulo'}">Titulo</option>
			<option value="autor" th:selected="${campo == 'autor'}">Autor</option>
			<option value="isbn" th:selected="${campo == 'isbn'}">ISBN</option>
			<option value="categoria" th:selected="${campo == 'categoria'}">Categoria</option>
		</select>
		<input type="text" name="texto" th:value="${texto}">
		<button type="submit">Buscar</button>
	</form>

	<p th:if="${session.rol == 'ADMIN'}">
		<a th:href="@{/admin/libros/nuevo}">Nuevo libro</a>
	</p>

	<table>
		<thead>
			<tr>
				<th>Titulo</th>
				<th>Autor</th>
				<th>ISBN</th>
				<th>Categoria</th>
				<th>Estado</th>
				<th th:if="${session.rol == 'ADMIN'}">Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="libro : ${libros}">
				<td th:text="${libro.titulo}"></td>
				<td th:text="${libro.autor}"></td>
				<td th:text="${libro.isbn}"></td>
				<td th:text="${libro.categoria}"></td>
				<td th:text="${libro.disponible ? 'Disponible' : 'Prestado'}"></td>
				<td th:if="${session.rol == 'ADMIN'}">
					<a th:href="@{/admin/libros/editar/{id}(id=${libro.id})}">Editar</a>
				</td>
			</tr>
		</tbody>
	</table>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>

</body>
</html>
